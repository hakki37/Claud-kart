name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter structure
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart
          cp config.dart lib/config.dart
          flutter create --platforms=android .
      - name: Dependencies
        run: flutter pub get
      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
