name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Android
        run: |
          flutter create --platforms=android .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if permission.strip() not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s)
          print(p.read_text())
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
